name: Validate tv=0.20 (one-off)
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance numpy pandas
      - name: Run validation
        run: python research/validate_tv.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: validate-tv-results
          path: validate_tv_results.csv
