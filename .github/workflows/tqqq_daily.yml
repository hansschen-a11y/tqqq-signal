name: TQQQ Daily Signal
on:
  schedule:
    # 2026-11-24 自癒：GitHub 排程常延遲 3-7 小時、偶爾整天丟掉（11/21、11/23 都沒跑）
    # → 改成 5 個備援時段（避開整點/半點的尖峰），由下方 guard 確保「美東同一天只推一次」
    # 全部時段都落在美東當天收盤後（冬令 16:37–22:07 ET；夏令 17:37–23:07 ET）
    - cron: '37 21 * * 1-5'    # 美東週一~五
    - cron: '53 22 * * 1-5'
    - cron: '19 0 * * 2-6'     # UTC 已跨日 → 星期欄位 +1
    - cron: '41 1 * * 2-6'
    - cron: '7 3 * * 2-6'
  workflow_dispatch:           # 手動觸發（一律執行，不受 guard 限制）
permissions:
  contents: write              # 2026-07-22: 改用內建 GITHUB_TOKEN 上傳 latest_signal.json（原 GH_PAT 已過期 401）
  issues: write                # LINE 推播失敗時開 Issue 備援通知（GitHub 會寄 email）
  actions: read                # guard 查今天是否已有成功的 run
concurrency:                   # 兩個時段同時被排進來時排隊，不並行（避免重複推播）
  group: tqqq-daily
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — 美東今天已成功推播就跳過
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          TODAY_ET=$(TZ=America/New_York date +%F)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/tqqq_daily.yml/runs?status=success&per_page=20" \
                --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .created_at] | .[]' \
              | while read t; do TZ=America/New_York date -d "$t" +%F; done | grep -c "^$TODAY_ET$" || true)
          echo "美東 $TODAY_ET 已成功 run 數：$N"
          if [ "${N:-0}" -ge 1 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "⏭ 今天已推播，跳過"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Checkout repo
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Setup Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install yfinance numpy pandas requests scipy
      - name: Run tests (gate)
        if: steps.guard.outputs.run == 'true'
        run: python tests/test_signal.py && python tests/test_ffill_fix.py
      - name: Run TQQQ signal
        if: steps.guard.outputs.run == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}   # 2026-07-22: 改 push 給自己，省額度
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}         # 2026-07-22: 原 GH_PAT secret 已過期，改用內建 token
          GITHUB_REPO: ${{ github.repository }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -o pipefail
          python tqqq_signal.py --line --upload --json | tee signal_output.log
      - name: LINE 失敗時開 Issue 備援（email 通知）
        if: failure() && steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f signal_output.log ] || exit 0
          if grep -q "LINE 發送失敗" signal_output.log; then
            TITLE="📊 TQQQ 每日訊號（LINE 備援）$(date -u '+%Y-%m-%d')"
            BODY=$(sed -n '/📊 TQQQ 每日訊號/,/^{/p' signal_output.log | sed '$d')
            [ -z "$BODY" ] && BODY=$(head -60 signal_output.log)
            ERR=$(grep "LINE API 回應" signal_output.log || echo "見 Actions log")
            printf '%s\n\n> ⚠️ LINE 推播失敗：%s\n' "$BODY" "$ERR" | \
              gh issue create --title "$TITLE" --body-file - || true
          fi
