name: TQQQ Daily Signal
on:
  schedule:
    # 21:30 UTC：夏令=美東17:30、冬令=美東16:30，全年都在收盤後
    - cron: '30 21 * * 1-5'
  workflow_dispatch:           # 手動觸發
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance numpy pandas requests scipy
      - name: Run tests (gate)
        run: python tests/test_signal.py
      - name: Run TQQQ signal
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python tqqq_signal.py --line --upload --json
