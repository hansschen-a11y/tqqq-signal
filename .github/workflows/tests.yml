name: Tests
on:
  push:
    paths:
      - 'tqqq_signal.py'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance numpy pandas requests scipy
      - name: Run tests
        run: python tests/test_signal.py
